version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-drop
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ceneged_service
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - spring-network

volumes:
  pgdata:

networks:
  spring-network: